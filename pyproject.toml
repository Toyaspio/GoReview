[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ayugo-review"
version = "0.4.1"
description = "Isolated MaiBot Go review worker"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "sgfmill==1.1.1", "fastapi==0.115.12", "uvicorn==0.34.2", "playwright==1.56.0", "python-socketio[asyncio_client]>=5.11,<6"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["goreview*"]

[tool.setuptools.package-data]
goreview = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

